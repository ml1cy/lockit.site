<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lockit.site</title>
    <style>
      :root {
        --bg-a: #090d1a;
        --bg-b: #1a0f2f;
        --bg-c: #10253a;
        --text: #eef4ff;
        --accent: #72f7d3;
        --accent-2: #8fb7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Space Grotesk",
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text);
        background: linear-gradient(-35deg, var(--bg-a), var(--bg-b), var(--bg-c));
        background-size: 240% 240%;
        animation: bgShift 16s ease infinite;
        overflow: hidden;
      }

      .noise,
      .grid {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .noise {
        opacity: 0.1;
        background-image: radial-gradient(rgba(255, 255, 255, 0.45) 1px, transparent 1px);
        background-size: 3px 3px;
        mix-blend-mode: soft-light;
      }

      .grid {
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at center, black 24%, transparent 88%);
      }

      .halo {
        position: fixed;
        width: 60vmax;
        aspect-ratio: 1;
        border-radius: 999px;
        filter: blur(64px);
        opacity: 0.42;
        animation: drift 18s ease-in-out infinite alternate;
      }

      .halo.one {
        left: -12vmax;
        top: -14vmax;
        background: #4c8dff;
      }

      .halo.two {
        right: -18vmax;
        bottom: -16vmax;
        background: #3ff8c2;
        animation-delay: 1.3s;
      }

      main {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .card {
        width: min(880px, 100%);
        padding: clamp(1.5rem, 3vw, 2.4rem);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(9, 15, 30, 0.6);
        backdrop-filter: blur(8px);
        box-shadow:
          0 22px 42px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      h1 {
        margin: 0;
        line-height: 1;
        font-size: clamp(2.2rem, 7vw, 5.4rem);
        letter-spacing: 0.03em;
      }

      .sub {
        margin: 0.7rem 0 1.7rem;
        color: rgba(238, 244, 255, 0.86);
        font-size: clamp(1rem, 2.2vw, 1.2rem);
      }

      .combo {
        display: inline-flex;
        gap: 0.75rem;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        padding: 0.42rem 0.8rem;
        background: rgba(255, 255, 255, 0.08);
      }

      .key {
        min-width: 3.2rem;
        text-align: center;
        border-radius: 10px;
        padding: 0.42rem 0.66rem;
        background: rgba(255, 255, 255, 0.97);
        color: #0f1931;
        font-weight: 700;
        box-shadow:
          0 4px 0 rgba(0, 0, 0, 0.28),
          0 0 0 1px rgba(0, 0, 0, 0.08) inset;
        animation: pulse 1.8s ease-in-out infinite;
      }

      .key:nth-child(2) {
        animation-delay: 0.2s;
      }

      .caption {
        margin-left: 0.2rem;
        font-weight: 600;
        color: var(--accent);
        letter-spacing: 0.02em;
      }

      .ticker {
        margin-top: 1.7rem;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
        padding-top: 1rem;
        color: rgba(238, 244, 255, 0.78);
        font-size: 0.96rem;
        white-space: nowrap;
        overflow: hidden;
        position: relative;
      }

      .ticker span {
        display: inline-block;
        padding-left: 100%;
        animation: slide 16s linear infinite;
      }

      @keyframes bgShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: translateY(0);
        }
        45% {
          transform: translateY(2px);
        }
      }

      @keyframes slide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-100%);
        }
      }

      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(7vmax, 4vmax) scale(1.06);
        }
      }
    </style>
  </head>
  <body>
    <div class="halo one" aria-hidden="true"></div>
    <div class="halo two" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>
    <main>
      <section class="card">
        <h1>LOCK IT, LEGEND.</h1>
        <p class="sub">Your keyboard has one quest before lunch break.</p>
        <div class="combo" aria-label="Windows plus L keyboard shortcut">
          <span class="key">⊞ Win</span>
          <span class="key">L</span>
          <span class="caption">Lock your machine in 1 second.</span>
        </div>
        <div class="ticker">
          <span
            >Security patch note: unlocked desktops now come with free class-wide memes •
            press Win + L to avoid reputational packet loss •</span
          >
        </div>
      </section>
    </main>
  </body>
</html>
